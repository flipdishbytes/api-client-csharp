# .NET Desktop
# Build and run tests for .NET Desktop or Windows classic desktop solutions.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/windows/dot-net

name: 1.2$(Rev:.r)

trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

pool:
  vmImage: 'windows-latest'

variables:
  # Secret nuget.org API key (NUGET_API_KEY) lives in this variable group
  # (Pipelines > Library > 'Flipdish NuGet'). Keep the group authorized for
  # this pipeline, otherwise runs fail with an authorization error.
- group: 'Flipdish NuGet'
- name: nuspec
  value: '**/Flipdish.csproj'
- name: buildPlatform
  value: 'Any CPU'
- name: buildConfiguration
  value: 'Release'
  # Publishing (pack + push) only on push to master. PR runs build + restore only.
  # Azure Pipelines has no 'Push' Build.Reason: push-triggered runs are 'IndividualCI'
  # or 'BatchedCI'. Build.Reason is a runtime variable - it is NOT available to
  # ${{ }} template expressions - so evaluate isMaster with $[ ].
  # String eq/in are case-insensitive, so eq(variables['isMaster'], 'true') below
  # matches the 'True'/'False' values a runtime expression produces.
- name: isMaster
  value: $[ and(eq(variables['Build.SourceBranch'], 'refs/heads/master'), in(variables['Build.Reason'], 'IndividualCI', 'BatchedCI')) ]

steps:
# Pin NuGet to 6.x: NuGet 7.x fails to parse the legacy solution file format
# (Format Version 12.00 / VS 14) with "Could not load Microsoft.Build.Framework
# Version=15.1.0.0" (see builds 1.1.530/1.2.434).
- task: NuGetToolInstaller@1
  inputs:
    versionSpec: '6.x'

- task: NuGetCommand@2
  inputs:
    # 'solution' was never defined - restore silently did nothing before.
    restoreSolution: 'Flipdish.sln'

- task: MSBuild@1
  inputs:
    solution: '**/*.sln'
    msbuildArchitecture: 'x64'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    clean: true
    maximumCpuCount: true
    # restoreNugetPackages must stay OFF: it makes MSBuild@1 run the agent's
    # bundled externals NuGet (C:\actions-runner\...\externals\nuget\NuGet.exe),
    # which fails on this legacy .sln ("Error parsing solution file ...
    # Microsoft.Build.Framework, Version=15.1.0.0" -> exit 1). Restore is
    # already handled above by NuGetCommand@2 using the pinned NuGet 6.x.

- task: NuGetCommand@2
  condition: and(succeeded(), eq(variables['isMaster'], 'true'))
  inputs:
    command: 'pack'
    packagesToPack: '$(nuspec)'
    versioningScheme: 'byBuildNumber'
  env:
    NUGET_ENABLE_LEGACY_PROJECT_JSON_PACK: true

# Push with the API key from the 'Flipdish NuGet' variable group (secret
# NUGET_API_KEY, mapped into env below so it is masked in logs). The
# NuGetCommand@2 task (>= 2.280.1) refuses API-key external service
# connections on NuGet 6.x ("External service connections that use API key
# authentication require NuGet 7.6 or later" - build 1.2.439), and the 6.x
# pin must stay for the legacy .sln restore, so push runs as a script.
# dotnet is preinstalled on hosted Windows agents; the nupkg produced by
# nuget.exe pack pushes exactly like any other package.
- task: PowerShell@2
  displayName: 'dotnet nuget push (nuget.org)'
  condition: and(succeeded(), eq(variables['isMaster'], 'true'))
  env:
    NUGET_API_KEY: $(NUGET_API_KEY)
  inputs:
    targetType: 'inline'
    script: |
      $ErrorActionPreference = 'Stop'
      $pkgs = Get-ChildItem "$env:BUILD_ARTIFACTSTAGINGDIRECTORY" -Filter *.nupkg |
        Where-Object { $_.Name -notlike '*.symbols.nupkg' }
      if (-not $pkgs) {
        Write-Host "##vso[task.logissue type=error]No .nupkg packages found in $env:BUILD_ARTIFACTSTAGINGDIRECTORY"
        exit 1
      }
      foreach ($pkg in $pkgs) {
        Write-Host "Pushing $($pkg.Name)"
        # --no-symbols: dotnet push would otherwise auto-push a matching .snupkg
        # --skip-duplicate: build re-runs after a successful push become a no-op
        dotnet nuget push "$($pkg.FullName)" --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY" --no-symbols --skip-duplicate
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }

# there are no tests in the solution (only src\Flipdish) - same as netcore repo
#- task: VSTest@2
#  inputs:
#    platform: '$(buildPlatform)'
#    configuration: '$(buildConfiguration)'
